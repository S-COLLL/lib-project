<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Payments · SmartLib</title>
  <link rel="icon" href="assets/logo.svg" type="image/svg+xml">
  <script src="js/theme-init.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/dashboard.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
  <main class="page" id="page">
    <div class="page-head">
      <div>
        <div class="breadcrumb"><a href="dashboard.html">Dashboard</a> / Payments</div>
        <h1>Payments</h1>
        <p class="subtitle">Payment history, receipts and the mock payment gateway (Cash · UPI · Card · Bank Transfer).</p>
      </div>
      <div class="page-actions" id="pageActions"></div>
    </div>
    <div class="stats-grid" id="stats" style="grid-template-columns:repeat(4,minmax(0,1fr))"></div>
    <div class="card">
      <div class="table-toolbar">
        <div class="input-group">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
          <input class="input" type="search" id="search" placeholder="Payment ID, receipt, member, reason, reference…" aria-label="Search payments">
        </div>
        <select class="select" id="status" style="width:auto" aria-label="Status"><option value="">All statuses</option><option>Paid</option><option>Partially Paid</option><option>Pending</option><option>Waived</option></select>
        <select class="select" id="method" style="width:auto" aria-label="Method"><option value="">All methods</option><option>Cash</option><option>UPI</option><option>Card</option><option>Bank Transfer</option></select>
        <input class="input" type="date" id="from" style="width:auto" aria-label="From date">
        <input class="input" type="date" id="to" style="width:auto" aria-label="To date">
      </div>
      <div id="memberFilter"></div>
      <div class="table-wrap"><table class="table">
        <thead><tr><th>Payment ID</th><th>Receipt</th><th>Member</th><th>Transaction</th><th>Reason</th><th>Amount</th><th>Date</th><th>Method</th><th>Status</th><th style="text-align:right">Actions</th></tr></thead>
        <tbody id="rows"></tbody>
      </table></div>
      <div class="pagination" id="pagination"></div>
    </div>
  </main>
  <script type="module" src="js/payments.js"></script>
</body>
</html>
