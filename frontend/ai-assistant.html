<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Assistant · SmartLib</title>
  <link rel="icon" href="assets/logo.svg" type="image/svg+xml">
  <script src="js/theme-init.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/responsive.css">
  <style>
    .ai-shell { display: flex; flex-direction: column; height: calc(100vh - var(--topbar-h) - 56px); min-height: 520px; overflow: hidden; }
    .ai-head { position: relative; overflow: hidden; background: var(--grad-premium); color: #fff; padding: 20px 24px; display: flex; align-items: center; gap: 16px; }
    .ai-head::before { content: ''; position: absolute; width: 320px; height: 320px; right: -80px; top: -160px; border-radius: 50%; background: radial-gradient(circle, rgba(20,184,166,.55), transparent 65%); animation: glow 6s ease-in-out infinite alternate; }
    @keyframes glow { to { transform: translate(-60px, 30px) scale(1.15); opacity: .7; } }
    .ai-orb { position: relative; width: 50px; height: 50px; border-radius: 15px; display: grid; place-items: center; background: rgba(20,184,166,.18); border: 1px solid rgba(94,234,212,.4); color: #5eead4; box-shadow: 0 0 30px rgba(20,184,166,.35); }
    .ai-orb svg { width: 26px; height: 26px; }
    .ai-orb::after { content: ''; position: absolute; inset: -5px; border-radius: 19px; border: 1px solid rgba(94,234,212,.35); animation: ring 2.4s var(--ease) infinite; }
    .ai-head h1 { color: #fff; font-size: 22px; } .ai-head p { color: rgba(226,232,240,.8); font-size: 13px; }
    .ai-head .status { margin-left: auto; font-size: 12px; display: flex; align-items: center; gap: 6px; color: #5eead4; position: relative; }
    .ai-head .status i { width: 8px; height: 8px; border-radius: 50%; background: #22c55e; box-shadow: 0 0 0 3px rgba(34,197,94,.25); }
    .chat { flex: 1; overflow-y: auto; padding: 24px; display: flex; flex-direction: column; gap: 16px; scroll-behavior: smooth; }
    .msg { display: flex; gap: 12px; max-width: 860px; animation: rise .4s var(--ease); }
    .msg.user { align-self: flex-end; flex-direction: row-reverse; }
    .msg .bubble { padding: 12px 16px; border-radius: 16px; font-size: 14px; line-height: 1.55; min-width: 0; }
    .msg.user .bubble { background: #e2e8f0; color: #0f172a; border-bottom-right-radius: 5px; }
    :root[data-theme='dark'] .msg.user .bubble { background: #334155; color: #f8fafc; }
    .msg.ai .bubble { background: #f0fdfa; border: 1px solid #ccfbf1; color: var(--text); border-bottom-left-radius: 5px; }
    :root[data-theme='dark'] .msg.ai .bubble { background: rgba(20,184,166,.08); border-color: rgba(20,184,166,.25); }
    .msg .who { width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; flex-shrink: 0; }
    .msg.ai .who { background: var(--grad-teal); color: #fff; }
    .msg.ai .who svg { width: 18px; height: 18px; }
    .typing { display: inline-flex; gap: 4px; padding: 4px 2px; }
    .typing i { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); animation: bounce 1s infinite; }
    .typing i:nth-child(2) { animation-delay: .15s; } .typing i:nth-child(3) { animation-delay: .3s; }
    @keyframes bounce { 0%, 60%, 100% { transform: translateY(0); opacity: .4; } 30% { transform: translateY(-5px); opacity: 1; } }
    .caret::after { content: '▍'; color: var(--accent); animation: blink .8s steps(1) infinite; margin-left: 1px; }
    @keyframes blink { 50% { opacity: 0; } }
    .ai-loc { margin-top: 10px; border-left: 3px solid var(--gold); background: var(--gold-bg); border-radius: 0 12px 12px 0; padding: 10px 14px; }
    .ai-loc .al-title { font-weight: 700; margin-bottom: 4px; display: flex; gap: 6px; align-items: center; }
    .ai-loc .al-path { display: flex; flex-wrap: wrap; gap: 4px 6px; font-size: 13px; }
    .ai-loc .al-path span { background: var(--card); border: 1px solid var(--border); border-radius: 6px; padding: 1px 8px; }
    .ai-loc .al-path span:last-child { border-color: var(--gold); font-weight: 600; }
    .ai-results { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 10px; margin-top: 12px; }
    .ai-book { display: flex; gap: 10px; padding: 10px; border: 1px solid var(--border); border-radius: 12px; background: var(--card); color: var(--text); text-decoration: none !important; transition: all var(--med) var(--ease); animation: rise .4s var(--ease) both; animation-delay: calc(var(--i) * 50ms); }
    .ai-book:hover { border-color: var(--accent); transform: translateY(-2px); box-shadow: var(--shadow); }
    .ai-book .ab-title { font-weight: 600; font-size: 13px; line-height: 1.3; }
    .ai-book .ab-loc { font-size: 11.5px; color: var(--gold-strong); font-weight: 600; margin-top: 3px; }
    .ai-actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
    .composer { border-top: 1px solid var(--border); padding: 14px 20px 18px; background: var(--card); }
    .composer form { display: flex; gap: 10px; }
    .composer .input { height: 48px; border-radius: 14px; font-size: 14.5px; }
    .composer .btn { height: 48px; border-radius: 14px; }
    .suggest { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 10px; scrollbar-width: none; }
    .suggest .chip { white-space: nowrap; }
    .suggest .chip svg { width: 14px; height: 14px; color: var(--gold-strong); }
    @media (max-width: 768px) { .chat { padding: 16px; } .ai-head { padding: 16px; } .ai-head .status { display: none; } .ai-shell { height: calc(100vh - var(--topbar-h) - 36px); } }
  </style>
</head>
<body>
  <main class="page" id="page" style="padding-bottom:20px">
    <section class="card ai-shell">
      <header class="ai-head">
        <div class="ai-orb" id="orb"></div>
        <div style="position:relative"><h1>AI Library Assistant</h1><p>Ask in plain English — I search the live catalogue, shelves and loans.</p></div>
        <div class="status"><i></i>Online · rule-based NLP</div>
      </header>
      <div class="chat" id="chat" aria-live="polite"></div>
      <div class="composer">
        <div class="suggest" id="suggest"></div>
        <form id="askForm">
          <input class="input" id="ask" placeholder="Try: “Where is The Alchemist?” or “Show science books under ₹500”" autocomplete="off" aria-label="Ask the assistant" maxlength="300">
          <button class="btn btn-primary" id="sendBtn" aria-label="Send"></button>
        </form>
      </div>
    </section>
  </main>
  <script type="module" src="js/ai-assistant.js"></script>
</body>
</html>
