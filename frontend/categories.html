<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Categories · SmartLib</title>
  <link rel="icon" href="assets/logo.svg" type="image/svg+xml">
  <script src="js/theme-init.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/responsive.css">
  <style>
    .cat-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(270px, 1fr)); gap: 16px; }
    .cat-card { padding: 18px; display: flex; flex-direction: column; gap: 12px; transition: transform var(--med) var(--ease), box-shadow var(--med) var(--ease), border-color var(--med); }
    .cat-card:hover { transform: translateY(-4px); box-shadow: var(--shadow-lg); border-color: var(--accent); }
    .cat-icon { width: 46px; height: 46px; border-radius: 12px; display: grid; place-items: center; font-size: 22px; background: var(--card-2); border: 1px solid var(--border); }
    .cat-nums { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
    .cat-nums div { border-radius: 10px; padding: 8px 10px; background: var(--card-2); }
    .cat-nums small { display: block; font-size: 11px; color: var(--text-2); }
    .cat-nums strong { font-size: 18px; font-variant-numeric: tabular-nums; }
    .stack-bar { display: flex; height: 8px; border-radius: 4px; overflow: hidden; background: var(--card-2); gap: 2px; }
    .stack-bar span { display: block; height: 100%; transition: width 900ms var(--ease); width: 0; }
  </style>
</head>
<body>
  <main class="page" id="page">
    <div class="page-head">
      <div>
        <div class="breadcrumb"><a href="dashboard.html">Dashboard</a> / Categories</div>
        <h1>Categories</h1>
        <p class="subtitle">Subjects in the collection with live availability.</p>
      </div>
      <div class="page-actions" id="pageActions"></div>
    </div>
    <div class="chart-legend" style="margin-bottom:14px;display:flex;gap:14px;font-size:12.5px;color:var(--text-2)">
      <span><i style="display:inline-block;width:10px;height:10px;border-radius:3px;background:var(--success)"></i> Available</span>
      <span><i style="display:inline-block;width:10px;height:10px;border-radius:3px;background:var(--info)"></i> Issued</span>
      <span><i style="display:inline-block;width:10px;height:10px;border-radius:3px;background:var(--gold)"></i> Reserved</span>
    </div>
    <div class="cat-grid" id="grid"></div>
  </main>
  <script type="module" src="js/categories.js"></script>
</body>
</html>
