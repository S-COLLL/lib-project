<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shelves · SmartLib</title>
  <link rel="icon" href="assets/logo.svg" type="image/svg+xml">
  <script src="js/theme-init.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/responsive.css">
  <style>
    .map-layout { display: grid; grid-template-columns: minmax(0, 1fr) 380px; gap: 20px; align-items: start; }
    .floor-map { padding: 20px; }
    .floor-plan { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 16px; margin-top: 16px; position: relative; }
    .section-block { border: 1px solid var(--border); border-radius: 16px; padding: 14px; background: linear-gradient(180deg, var(--card-2), var(--card)); }
    .section-block h3 { font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: var(--text-2); display: flex; justify-content: space-between; margin-bottom: 10px; }
    .shelf-tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 10px; }
    .shelf-tile { position: relative; text-align: left; border: 1px solid var(--border); border-radius: 12px; background: var(--card); padding: 10px 10px 9px; cursor: pointer; transition: transform var(--med) var(--ease), box-shadow var(--med) var(--ease), border-color var(--med); overflow: hidden; }
    .shelf-tile::before { content: ''; position: absolute; left: 0; right: 0; bottom: 0; height: calc(var(--pct) * 1%); max-height: 100%; background: var(--occ-bg); transition: height 900ms var(--ease); }
    .shelf-tile > * { position: relative; }
    .shelf-tile:hover { transform: translateY(-3px); box-shadow: var(--shadow-lg); border-color: var(--fill); }
    .shelf-tile.selected { border-color: var(--fill); box-shadow: 0 0 0 3px var(--occ-bg), 0 0 24px var(--occ-bg), var(--shadow-lg); transform: translateY(-3px) scale(1.03); }
    .shelf-tile .st-code { font-size: 20px; font-weight: 700; letter-spacing: -.02em; }
    .shelf-tile .st-pct { font-size: 12px; font-weight: 700; color: var(--occ); }
    .shelf-tile .st-blocks { font-size: 10px; margin-top: 2px; }
    .shelf-tile.maint { opacity: .6; }
    .shelf-tile .st-status { position: absolute; top: 8px; right: 8px; width: 8px; height: 8px; border-radius: 50%; background: var(--fill); }
    .entrance { display: flex; align-items: center; justify-content: center; gap: 8px; margin-top: 16px; padding: 8px; border: 1px dashed var(--border-strong); border-radius: 10px; font-size: 11.5px; letter-spacing: .12em; text-transform: uppercase; color: var(--text-2); }
    .entrance svg { width: 16px; height: 16px; color: var(--accent); }
    .shelf-panel { position: sticky; top: calc(var(--topbar-h) + 20px); max-height: calc(100vh - var(--topbar-h) - 40px); overflow-y: auto; }
    .shelf-panel .sp-anim { animation: panelIn var(--slow) var(--ease); }
    @keyframes panelIn { from { opacity: 0; transform: translateX(24px); filter: blur(4px); } }
    .sp-head { padding: 20px; border-bottom: 1px solid var(--border); position: relative; overflow: hidden; }
    .sp-head::after { content: ''; position: absolute; right: -40px; top: -40px; width: 140px; height: 140px; border-radius: 50%; background: radial-gradient(circle, var(--occ-bg), transparent 70%); }
    .sp-big { font-size: 40px; font-weight: 800; letter-spacing: -.04em; color: var(--occ); line-height: 1; }
    .sp-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 14px; }
    .sp-stats div { border: 1px solid var(--border); border-radius: 10px; padding: 8px 10px; }
    .sp-stats small { display: block; font-size: 11px; color: var(--text-2); }
    .sp-stats strong { font-size: 18px; font-variant-numeric: tabular-nums; }
    .sp-book { display: flex; gap: 10px; align-items: center; padding: 9px 20px; border-bottom: 1px solid var(--border); animation: rise var(--med) var(--ease) both; animation-delay: calc(var(--i) * 35ms); }
    .sp-book .pos { font-family: ui-monospace, Consolas, monospace; font-size: 11.5px; background: var(--gold-bg); color: var(--gold-strong); padding: 2px 6px; border-radius: 6px; white-space: nowrap; }
    @media (max-width: 1100px) { .map-layout { grid-template-columns: 1fr; } .shelf-panel { position: static; max-height: none; } }
  </style>
</head>
<body>
  <main class="page" id="page">
    <div class="page-head">
      <div>
        <div class="breadcrumb"><a href="dashboard.html">Dashboard</a> / Shelves</div>
        <h1>Shelves &amp; library map</h1>
        <p class="subtitle">Click any shelf to see its capacity and the books stored there.</p>
      </div>
      <div class="page-actions" id="pageActions"></div>
    </div>

    <div class="map-layout">
      <div class="card floor-map">
        <div class="row-between wrap">
          <div class="tabs" id="floorTabs" role="tablist" aria-label="Floors"></div>
          <div class="chart-legend occ-legend">
            <span class="occ-low"><i></i>Low</span><span class="occ-med"><i></i>Medium</span><span class="occ-high"><i></i>High</span><span class="occ-full"><i></i>Full</span>
          </div>
        </div>
        <div class="floor-plan" id="floorPlan"></div>
        <div class="entrance" id="entrance"></div>
      </div>
      <aside class="card shelf-panel" id="shelfPanel" aria-live="polite"></aside>
    </div>

    <div class="card" style="margin-top:20px">
      <div class="card-head"><div><h2>Shelf management</h2><div class="ch-sub">All shelves across floors</div></div></div>
      <div class="card-body" style="padding-top:12px">
        <div class="table-wrap"><table class="table">
          <thead><tr><th>Shelf ID</th><th>Name</th><th>Floor</th><th>Section</th><th>Racks</th><th>Category</th><th>Capacity</th><th>Occupied</th><th>Available</th><th style="min-width:180px">Occupancy</th><th>Status</th><th></th></tr></thead>
          <tbody id="shelfTable"></tbody>
        </table></div>
      </div>
    </div>
  </main>
  <script type="module" src="js/shelves.js"></script>
</body>
</html>
